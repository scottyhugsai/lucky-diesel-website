# Vulnerability alerts arrive whether or not this file exists; this is what
# turns them into a pull request that CI can prove safe to merge.
#
# Weekly rather than daily, and minor/patch grouped into one PR, because a
# stream of individual bumps on a small site gets ignored — and an ignored
# alert is the failure mode this is meant to prevent. Majors come separately
# since they need reading.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # A compromised release is usually pulled within days of publication, and
    # a bot that opens a PR the hour it lands is how that reaches a codebase.
    # Wait, and let someone else find it first.
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
